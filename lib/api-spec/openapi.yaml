openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: research
    description: Evidence-grounded research
  - name: status
    description: Non-secret runtime configuration status
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /status:
    get:
      operationId: getResearchRuntimeStatus
      tags: [status]
      summary: Get research runtime status
      description: Reports non-secret mode and configuration flags without claiming external reachability.
      responses:
        "200":
          description: Runtime configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchRuntimeStatus"
  /ask:
    post:
      operationId: askGlobalEdge
      tags: [research]
      summary: Ask a research question
      description: Submits a single question to the configured research transport and returns a normalized result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchQuestion"
      responses:
        "200":
          description: Research result, including blocked and insufficient-evidence outcomes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Invalid or unavailable upstream response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Live mode is missing required configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: Upstream request timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Request body is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ResearchQuestion:
      type: object
      additionalProperties: false
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 2000
        requestId:
          type: string
          minLength: 8
          maxLength: 80
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"
      required: [question, requestId]
    Metric:
      type: object
      additionalProperties: false
      properties:
        value:
          type: ["number", "null"]
        scaleMin:
          type: ["number", "null"]
        scaleMax:
          type: ["number", "null"]
        method:
          type: ["string", "null"]
        explanation:
          type: ["string", "null"]
      required: [value, scaleMin, scaleMax, method, explanation]
    ResearchSource:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 80
        kind:
          type: string
          enum: [filing, news, price]
        title:
          type: ["string", "null"]
        documentName:
          type: ["string", "null"]
        publisher:
          type: ["string", "null"]
        url:
          type: ["string", "null"]
        date:
          type: ["string", "null"]
        dateMeaning:
          type: ["string", "null"]
        page:
          type: ["integer", "null"]
        recordId:
          type: ["string", "null"]
        excerpt:
          type: ["string", "null"]
        usage:
          type: string
          enum: [cited, retrieved, unknown]
      required:
        - id
        - kind
        - title
        - documentName
        - publisher
        - url
        - date
        - dateMeaning
        - page
        - recordId
        - excerpt
        - usage
    ResearchEvaluation:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [complete, pending, unavailable, failed]
        groundedness:
          anyOf:
            - $ref: "#/components/schemas/Metric"
            - type: "null"
        answerRelevance:
          anyOf:
            - $ref: "#/components/schemas/Metric"
            - type: "null"
        contextPrecision:
          anyOf:
            - $ref: "#/components/schemas/Metric"
            - type: "null"
        overall:
          anyOf:
            - $ref: "#/components/schemas/Metric"
            - type: "null"
        verdict:
          type: ["string", "null"]
        judgeModel:
          type: ["string", "null"]
        rubricVersion:
          type: ["string", "null"]
      required:
        - status
        - groundedness
        - answerRelevance
        - contextPrecision
        - overall
        - verdict
        - judgeModel
        - rubricVersion
    ResearchGuardrails:
      type: object
      additionalProperties: false
      properties:
        input:
          type: string
          enum: [passed, blocked, not_reported]
        output:
          type: string
          enum: [passed, blocked, not_reported]
        safeMessage:
          type: ["string", "null"]
      required: [input, output, safeMessage]
    ResearchError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        safeMessage:
          type: string
        retryable:
          type: boolean
      required: [code, safeMessage, retryable]
    ResearchResult:
      type: object
      additionalProperties: false
      properties:
        schemaVersion:
          type: string
          enum: ["1"]
        mode:
          type: string
          enum: [fixture, live]
        requestId:
          type: string
        runId:
          type: ["string", "null"]
        question:
          type: string
        status:
          type: string
          enum: [completed, insufficient_evidence, blocked, error]
        answer:
          type: ["string", "null"]
        sources:
          type: array
          items:
            $ref: "#/components/schemas/ResearchSource"
        warnings:
          type: array
          items:
            type: string
        referencePeriod:
          type: ["string", "null"]
        evaluation:
          $ref: "#/components/schemas/ResearchEvaluation"
        guardrails:
          $ref: "#/components/schemas/ResearchGuardrails"
        backendElapsedMs:
          type: ["integer", "null"]
          minimum: 0
        evaluationStorageStatus:
          type: string
          enum: [saved, failed, not_implemented, unknown]
        error:
          anyOf:
            - $ref: "#/components/schemas/ResearchError"
            - type: "null"
      required:
        - schemaVersion
        - mode
        - requestId
        - runId
        - question
        - status
        - answer
        - sources
        - warnings
        - referencePeriod
        - evaluation
        - guardrails
        - backendElapsedMs
        - evaluationStorageStatus
        - error
    ApiError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
      required: [code, message]
    ResearchRuntimeStatus:
      type: object
      additionalProperties: false
      properties:
        dataMode:
          type: string
          enum: [fixture, live]
        researchWebhookConfigured:
          type: boolean
        connectionTestConfigured:
          type: boolean
        researchReachability:
          type: string
          enum: [not_configured, configured_not_verified]
        questionMaxLength:
          type: integer
          minimum: 1
          maximum: 2000
      required:
        - dataMode
        - researchWebhookConfigured
        - connectionTestConfigured
        - researchReachability
        - questionMaxLength
